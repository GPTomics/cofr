[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[project]
name = 'cofr-research'
version = '0.4.0'
description = 'Agent-first epistemic state engine for long-horizon technical work'
readme = 'README.md'
license = {text = 'MIT'}
requires-python = '>=3.12'
authors = [
    {name = 'Domen Jemec', email = 'domen.jemec@gmail.com'},
]
keywords = ['agent', 'research', 'epistemic-state', 'claude-code', 'cli']
classifiers = [
    'Development Status :: 3 - Alpha',
    'Environment :: Console',
    'Intended Audience :: Science/Research',
    'License :: OSI Approved :: MIT License',
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
]
dependencies = [
    'PyYAML>=6.0',
    'python-frontmatter>=1.1.0',
    'markitdown[pdf]>=0.1.5',
    'Pillow>=10.0',
    'python-docx>=1.1',
    'openpyxl>=3.1',
]

[project.optional-dependencies]
dev = [
    'pytest>=8.0',
]

[project.urls]
Homepage = 'https://github.com/GPTomics/cofr'
Repository = 'https://github.com/GPTomics/cofr'

[project.scripts]
cofr = 'cofr.cli:main'

[tool.hatch.build.targets.wheel]
packages = ['src/cofr']

[tool.hatch.build.targets.wheel.force-include]
'src/cofr/help.txt' = 'cofr/help.txt'

[tool.hatch.build.targets.sdist]
exclude = [
    '/.claude',
    '/AGENTS.md',
    '/CLAUDE.md',
    '/ARCHITECTURE_PLAN.md',
    '/M1_SPEC.md',
    '/bugs.md',
]

[tool.pytest.ini_options]
testpaths = ['tests']
python_files = ['test_*.py']
addopts = '-v --tb=short'
