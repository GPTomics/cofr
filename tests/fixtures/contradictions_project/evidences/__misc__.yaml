- id: ev_con
  type: evidence
  evidence_type: experiment_result
  strength: high
  summary: A holdout evaluation result that opposes the conflicted claim.
  claim_links:
    - claim_id: claim_conflict
      polarity: opposes
- id: ev_falsification
  type: evidence
  evidence_type: paper_note
  strength: medium
